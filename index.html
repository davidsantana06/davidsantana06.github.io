    <title>David Santana</title>
    <link rel="icon" href="./assets/favicon.ico" />

    <script>

    <script defer src="./assets/vendor/alpinejs-intersect.min.js"></script>
    <script defer src="./assets/vendor/alpinejs.min.js"></script>
  </head>

    <!-- # -->

    <!-- home -->
    <div id="home" class="container px-5 py-6" x-data="getPlatforms()">
      <div class="columns is-vcentered">
        <aside class="column is-3">
          <figure class="image is-flex is-justify-content-center">
            <img
              class="is-max-width-256 is-rounded cssanimation ca__fx-fadeInLeft ca__u-delay180"
              src="./assets/img/davidsantana06.jpeg"
            />
          </figure>
        </aside>

        <div class="column">
          <main>
            <h1 class="title is-4 mb-3 cssanimation ca__fx-fadeInRight">
              David Santana
            </h1>
            <p
              class="mb-3 cssanimation ca__fx-fadeInRight ca__u-delay90"
              x-html="$t('home.summary')"
            ></p>
            <div
              class="is-flex is-align-items-center is-gap-3 cssanimation ca__fx-fadeInBottom ca__u-delay270"
            >
              <template x-for="(platform, index) in platforms">
                <a
                  class="icon-text platform-link"
                  :style="`--platform-color: ${platform.color};`"
                  :href="platform.url"
                  target="_blank"
                  :title="$t('home.openPlatformProfile', { platformLabel: platform.label })"
                >
                  <span class="icon">
                    <svg class="icon-svg">
                      <use :href="`#icon-${platform.icon}`"></use>
                    </svg>
                  </span>
                  <span x-text="platform.label"></span>
                </a>
              </template>
            </div>
          </main>
        </div>
      </div>
    </div>
    <!-- # -->

    <!-- sections -->
    <template x-data="getSections()" x-for="(section, index) in sections">
      <section
        :id="`section-${index}`"
        class="hero is-fullheight"
        data-reveal
        x-data="{ shown: false }"
        x-intersect.once="shown = true"
        :class="{ 'is-dark': isEven(index), 'is-revealed': shown }"
      >
        <div
          class="hero-body is-align-items-start is-flex-direction-column is-justify-content-center"
        >
          <h3
            class="title is-5 mb-0 cssanimation ca__fx-fadeIn"
            x-text="section.title"
          ></h3>

          <template x-for="(entry, entryIndex) in section.entries">
            <div
              class="mt-5 cssanimation ca__fx-fadeIn"
              :style="`animation-delay: ${(entryIndex + 1) * 90}ms`"
            >
              <h4 class="title is-6" x-text="entry.title"></h4>

              <h5 class="subtitle is-7 mb-0">
                <template x-if="entry.organization">
                  <b x-text="`${entry.organization} &#8226;`"></b>
                </template>

                <span
                  x-text="`${entry.startDate} &rarr; ${entry.endDate}`"
                ></span>
              </h5>

              <template x-if="entry.reference">
                <a
                  class="icon-text has-text-primary mt-1"
                  :href="entry.reference.url"
                  target="_blank"
                >
                  <span x-text="entry.reference.label"></span>
                  <span class="icon">
                    <svg class="icon-svg">
                      <use href="#icon-arrow-up-right-from-square"></use>
                    </svg>
                  </span>
                </a>
              </template>

              <template x-if="entry.bullets">
                <ul class="pl-5 is-flex is-flex-direction-column is-gap-1 mt-2">
                  <template x-for="bullet in entry.bullets">
                    <li x-text="bullet"></li>
                  </template>
                </ul>
              </template>
            </div>
          </template>
        </div>
      </section>
    </template>
    <!-- # -->

    <!-- footer -->
    <footer
      class="footer pb-6 pt-6 cssanimation ca__fx-fadeIn"
      data-reveal
      x-data="{ shown: false }"
      x-intersect.once.margin.-120px="shown = true"
      :class="{ 'is-revealed': shown }"
    >
      <div class="content has-text-centered">
        <figure class="image is-128x128 is-inline-block">
          <img
            class="is-rounded has-shadow"
            src="./assets/img/goku-about-to-teleport.gif"
          />
        </figure>
      </div>
    </footer>
    <!-- # -->

    <!-- actions -->
    <div
      id="actions"
      class="is-position-fixed is-right-0 is-bottom-0 mr-5 mb-5"
      x-data
    >
      <div
        class="dropdown is-up is-right is-hoverable cssanimation ca__fx-bounceInBottom ca__u-delay360"
      >
        <div class="dropdown-trigger">
          <button class="button">
            <span x-text="$t('actions.label')"></span>
            <span class="icon is-small">
              <svg class="icon-svg">
                <use href="#icon-angle-up"></use>
              </svg>
            </span>
          </button>
        </div>

        <div class="dropdown-menu">
          <div class="dropdown-content">
            <a class="dropdown-item is-unselectable" href="#home">
              <svg class="icon-svg"><use href="#icon-arrow-up"></use></svg>
              <span x-text="$t('actions.backToTop.label')"></span>
            </a>
            <hr class="dropdown-divider" />
            <a
              class="dropdown-item is-unselectable"
              :href="$t('actions.openResume.url')"
              target="_blank"
            >
              <svg class="icon-svg">
                <use href="#icon-arrow-up-right-from-square"></use>
              </svg>
              <span x-text="$t('actions.openResume.label')"></span>
            </a>
          </div>
        </div>
      </div>
    </div>
    <!-- # -->
  </body>
</html>
